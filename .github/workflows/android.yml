name: Untitled
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.untitled.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.untitled.app"
                  minSdk = 29; targetSdk = 34; versionCode = 1; versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("com.google.mediapipe:tasks-genai:0.10.24")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="untitled" android:largeHeap="true" android:theme="@style/Theme.Untitled">
                  <uses-native-library android:name="libOpenCL.so" android:required="false"/>
                  <uses-native-library android:name="libvndksupport.so" android:required="false"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/untitled/app
          cat > app/src/main/java/com/untitled/app/Brain.kt <<'EOF'
          package com.untitled.app

          import kotlin.math.ln

          /** Bare-bones brain written from scratch. It knows only what you teach it. */
          object Brain {
              private val stop = setOf("the","an","is","are","was","were","do","does","did","what","who","where","when","why","how",
                  "of","to","in","on","and","or","it","this","that","me","tell","about","can","you","my","your","am","be","please","with","for","called","name")
              private val qStart = setOf("what","who","where","when","why","how","which","do","does","did","is","are","can","could","tell")
              private val swap = mapOf("my" to "your","your" to "my","i" to "you","you" to "I","me" to "you","am" to "are","mine" to "yours","yours" to "mine")

              private fun stem(w: String) = when {
                  w.length > 5 && w.endsWith("ing") -> w.dropLast(3)
                  w.length > 4 && w.endsWith("ed") -> w.dropLast(2)
                  w.length > 3 && w.endsWith("s") -> w.dropLast(1)
                  else -> w
              }
              private fun toks(s: String) = s.lowercase().split(Regex("[^a-z0-9]+")).filter { it.length > 1 && it !in stop }.map { stem(it) }
              private fun key(l: String) = l.substringBefore("=>")

              private fun person(s: String) = s.split(" ").joinToString(" ") { w ->
                  val core = w.trimEnd('.', ',', '!', '?'); val tail = w.substring(core.length)
                  (swap[core.lowercase()] ?: core) + tail
              }

              // Word-overlap score, rarer words count more (simple TF-IDF style).
              private fun best(q: List<String>, l: List<String>): Pair<String, Double>? {
                  val df = HashMap<String, Int>()
                  l.forEach { x -> toks(key(x)).toSet().forEach { df[it] = (df[it] ?: 0) + 1 } }
                  fun idf(t: String) = ln(1.0 + l.size / (1.0 + (df[t] ?: 0)))
                  val tot = q.sumOf { idf(it) }
                  if (tot == 0.0) return null
                  return l.map { x -> val lt = toks(key(x)).toSet(); x to q.filter { it in lt }.sumOf { idf(it) } / tot }.maxByOrNull { it.second }
              }

              fun respond(text: String, lessons: MutableList<String>): String {
                  val t = text.trim()
                  val low = t.lowercase().trimEnd('!', '.', '?')
                  if (low in setOf("hi", "hello", "hey")) return "Hi! Tell me things and I'll remember them, or ask me what I know."
                  if (low.startsWith("what do you know") || low == "list")
                      return if (lessons.isEmpty()) "Nothing yet. Teach me!" else lessons.mapIndexed { i, l -> "${i + 1}. $l" }.joinToString("\n")
                  if (low.startsWith("forget ")) {
                      val b = best(toks(low.removePrefix("forget ")), lessons)
                      return if (b != null && b.second > 0.3) { lessons.remove(b.first); "Forgot: ${b.first}" } else "I don't have that."
                  }
                  val isQ = t.endsWith("?") || low.substringBefore(" ") in qStart
                  if (!isQ) {
                      val fact = t.replace(Regex("(?i)^remember( that)?\\s+"), "")
                      if (fact in lessons) return "I already know that."
                      lessons.add(fact)
                      return "Got it. I'll remember: ${person(fact)}"
                  }
                  val b = best(toks(t), lessons)
                  if (b == null || b.second < 0.4) return "I don't know that yet. Tell me and I'll remember it."
                  val l = b.first
                  return person(if ("=>" in l) l.substringAfter("=>").trim() else l).replaceFirstChar { it.uppercase() }
              }
          }
          EOF
          mkdir -p app/src/main/java/com/untitled/app
          cat > app/src/main/java/com/untitled/app/MainActivity.kt <<'EOF'
          package com.untitled.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.result.PickVisualMediaRequest
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.*
          import com.google.mediapipe.framework.image.BitmapImageBuilder
          import com.google.mediapipe.tasks.genai.llminference.GraphOptions
          import com.google.mediapipe.tasks.genai.llminference.LlmInference
          import com.google.mediapipe.tasks.genai.llminference.LlmInferenceSession
          import kotlinx.coroutines.*
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.math.*

          val Cyan = Color(0xFF00E5FF)
          val Pink = Color(0xFFFF2D95)
          val Violet = Color(0xFF8A2BE2)

          data class Msg(val user: Boolean, val text: String, val img: Bitmap? = null)

          // ---------- storage: rules, lessons, model path ----------
          class Store(ctx: Context) {
              private val p = ctx.getSharedPreferences("untitled", 0)
              var rules: String
                  get() = p.getString("rules", "Be concise, honest and friendly.")!!
                  set(v) = p.edit().putString("rules", v).apply()
              var model: String
                  get() = p.getString("model", "")!!
                  set(v) = p.edit().putString("model", v).apply()
              fun lessons(): List<String> = p.getString("lessons", "")!!.split("\n").filter { it.isNotBlank() }
              fun saveLessons(l: List<String>) = p.edit().putString("lessons", l.joinToString("\n")).apply()
          }

          // ---------- on-device model (Gemma 3n via MediaPipe) ----------
          class Engine(private val ctx: Context) {
              private var llm: LlmInference? = null
              fun load(path: String) {
                  llm = LlmInference.createFromOptions(
                      ctx,
                      LlmInference.LlmInferenceOptions.builder()
                          .setModelPath(path).setMaxTokens(2048).setMaxNumImages(1).build()
                  )
              }
              fun unload() { llm?.close(); llm = null }
              fun ask(prompt: String, img: Bitmap?): String {
                  val s = LlmInferenceSession.createFromOptions(
                      llm!!,
                      LlmInferenceSession.LlmInferenceSessionOptions.builder()
                          .setTopK(40).setTemperature(0.8f)
                          .setGraphOptions(GraphOptions.builder().setEnableVisionModality(img != null).build())
                          .build()
                  )
                  try {
                      s.addQueryChunk(prompt)
                      if (img != null) s.addImage(BitmapImageBuilder(img).build())
                      return s.generateResponse()
                  } finally { s.close() }
              }
          }

          fun fetchPage(url: String): String {
              val c = URL(url).openConnection() as HttpURLConnection
              c.setRequestProperty("User-Agent", "Mozilla/5.0")
              c.connectTimeout = 8000; c.readTimeout = 8000
              val html = c.inputStream.bufferedReader().readText()
              return html.replace(Regex("(?is)<(script|style)[^>]*>.*?</\\1>"), "")
                  .replace(Regex("<[^>]+>"), " ").replace(Regex("\\s+"), " ").trim().take(3000)
          }

          // Your taught lessons most related to the question are placed in the prompt.
          fun buildPrompt(rules: String, lessons: List<String>, hist: List<Msg>, q: String, page: String?): String {
              val words = q.lowercase().split(Regex("\\W+")).filter { it.length > 2 }.toSet()
              val rel = lessons.sortedByDescending { l -> l.lowercase().split(Regex("\\W+")).count { it in words } }.take(6)
              val sb = StringBuilder("<start_of_turn>user\nRULES:\n$rules\n")
              if (rel.isNotEmpty()) sb.append("THINGS YOUR OWNER TAUGHT YOU (treat as true):\n" + rel.joinToString("\n") { "- $it" } + "\n")
              if (hist.isNotEmpty()) sb.append("RECENT CHAT:\n" + hist.joinToString("\n") { (if (it.user) "User: " else "You: ") + it.text.take(300) } + "\n")
              if (page != null) sb.append("WEB PAGE TEXT:\n$page\n")
              sb.append("\nUSER: $q<end_of_turn>\n<start_of_turn>model\n")
              return sb.toString()
          }

          fun loadBitmap(ctx: Context, uri: Uri): Bitmap? {
              val b = ctx.contentResolver.openInputStream(uri).use { BitmapFactory.decodeStream(it) } ?: return null
              val s = 512f / max(b.width, b.height)
              return if (s < 1f) Bitmap.createScaledBitmap(b, (b.width * s).toInt(), (b.height * s).toInt(), true) else b
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  val st = Store(this); val eng = Engine(this)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(primary = Cyan, secondary = Pink, background = Color(0xFF0B0B1A), surface = Color(0xFF15152B))) {
                          UntitledApp(st, eng)
                      }
                  }
              }
          }

          // ---------- 3D spinning cube logo ----------
          @Composable
          fun SpinLogo(size: Dp = 44.dp) {
              val t by rememberInfiniteTransition(label = "spin").animateFloat(
                  0f, (2 * PI).toFloat(), infiniteRepeatable(tween(6000, easing = LinearEasing)), label = "a"
              )
              val colors = listOf(Cyan, Pink, Violet, Cyan, Pink, Violet)
              val faces = listOf(
                  intArrayOf(0, 1, 3, 2), intArrayOf(4, 5, 7, 6), intArrayOf(0, 1, 5, 4),
                  intArrayOf(2, 3, 7, 6), intArrayOf(0, 2, 6, 4), intArrayOf(1, 3, 7, 5)
              )
              Canvas(Modifier.size(size)) {
                  val u = this.size.minDimension / 4.2f
                  val cx = this.size.width / 2; val cy = this.size.height / 2
                  val a = 0.5f
                  val pts = (0 until 8).map { i ->
                      val x = if (i and 4 == 0) -1f else 1f
                      val y = if (i and 2 == 0) -1f else 1f
                      val z = if (i and 1 == 0) -1f else 1f
                      val x1 = x * cos(t) + z * sin(t); val z1 = -x * sin(t) + z * cos(t)
                      val y2 = y * cos(a) - z1 * sin(a); val z2 = y * sin(a) + z1 * cos(a)
                      val p = 4f / (4f - z2)
                      floatArrayOf(cx + x1 * p * u, cy + y2 * p * u, z2)
                  }
                  faces.withIndex().sortedBy { (_, f) -> f.map { pts[it][2] }.average() }.forEach { (i, f) ->
                      val path = Path().apply {
                          moveTo(pts[f[0]][0], pts[f[0]][1])
                          for (k in 1..3) lineTo(pts[f[k]][0], pts[f[k]][1])
                          close()
                      }
                      drawPath(path, colors[i].copy(alpha = 0.85f))
                      drawPath(path, Color.White.copy(alpha = 0.7f), style = Stroke(2f))
                  }
              }
          }

          @Composable
          fun Bubble(m: Msg) {
              Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), horizontalArrangement = if (m.user) Arrangement.End else Arrangement.Start) {
                  Column(Modifier.widthIn(max = 300.dp).background(if (m.user) Pink.copy(alpha = .28f) else Cyan.copy(alpha = .18f), RoundedCornerShape(16.dp)).padding(12.dp)) {
                      m.img?.let { Image(it.asImageBitmap(), null, Modifier.size(160.dp).clip(RoundedCornerShape(10.dp))) }
                      Text(m.text, color = Color.White)
                  }
              }
          }

          @Composable
          fun UntitledApp(st: Store, eng: Engine) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var tab by remember { mutableIntStateOf(0) }
              val msgs = remember { mutableStateListOf<Msg>() }
              val lessons = remember { mutableStateListOf<String>().apply { addAll(st.lessons()) } }
              var on by remember { mutableStateOf(false) }
              var busy by remember { mutableStateOf(false) }
              var status by remember { mutableStateOf("off") }
              var rules by remember { mutableStateOf(st.rules) }
              var model by remember { mutableStateOf(st.model) }
              var pending by remember { mutableStateOf<Bitmap?>(null) }
              var input by remember { mutableStateOf("") }
              var newLesson by remember { mutableStateOf("") }
              val listState = rememberLazyListState()
              LaunchedEffect(msgs.size) { if (msgs.isNotEmpty()) listState.animateScrollToItem(msgs.size - 1) }

              val imgPicker = rememberLauncherForActivityResult(ActivityResultContracts.PickVisualMedia()) { uri ->
                  uri?.let { pending = loadBitmap(ctx, it) }
              }
              val modelPicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) {
                      busy = true; status = "copying model..."
                      scope.launch {
                          val path = withContext(Dispatchers.IO) {
                              val f = File(ctx.filesDir, "model.task")
                              ctx.contentResolver.openInputStream(uri)!!.use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                              f.absolutePath
                          }
                          st.model = path; model = path; status = "off"; busy = false
                      }
                  }
              }

              // On/off only works when the AI is idle (not loading, not answering).
              fun power(want: Boolean) {
                  if (busy) return
                  busy = true; status = if (want) "loading..." else "stopping..."
                  scope.launch {
                      val err = withContext(Dispatchers.IO) {
                          try { if (model.isNotBlank()) { if (want) eng.load(model) else eng.unload() }; null } catch (e: Throwable) { e.message ?: "error" }
                      }
                      if (err == null) { on = want; status = if (want) "on" else "off" } else { on = false; status = "error: $err" }
                      busy = false
                  }
              }

              fun send(text: String) {
                  if (busy || text.isBlank()) return
                  input = ""
                  if (text.startsWith("/teach ")) {
                      val l = text.removePrefix("/teach ").replace("\n", " ").trim()
                      lessons.add(l); st.saveLessons(lessons); msgs.add(Msg(false, "Learned: $l")); return
                  }
                  if (!on) { msgs.add(Msg(false, "Switch me on first (top right).")); return }
                  if (model.isBlank()) {
                      val img0 = pending; pending = null
                      msgs.add(Msg(true, text, img0))
                      val r = if (img0 != null) "My basic brain can't see pictures. Load a Gemma model in Settings for that." else Brain.respond(text, lessons)
                      st.saveLessons(lessons); msgs.add(Msg(false, r)); return
                  }
                  val img = pending; pending = null
                  val hist = msgs.takeLast(4).toList()
                  msgs.add(Msg(true, text, img)); busy = true; status = "thinking..."
                  scope.launch {
                      val reply = withContext(Dispatchers.IO) {
                          try {
                              val url = Regex("https?://\\S+").find(text)?.value
                              val page = url?.let { runCatching { fetchPage(it) }.getOrNull() }
                              eng.ask(buildPrompt(rules, lessons.toLi